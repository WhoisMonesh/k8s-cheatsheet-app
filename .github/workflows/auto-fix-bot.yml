name: Auto Fix Bot

on:
  push:
    branches: [main, dev, 'feature/**', 'fix/**']
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to auto-fix'
        required: true
        default: 'main'
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-fix-lint:
    name: Auto Fix ESLint Issues
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.event.inputs.branch || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Auto-fix ESLint issues
        id: lint-fix
        run: |
          npm run lint -- --fix 2>&1 || true
          CHANGED=$(git diff --name-only)
          if [ -n "$CHANGED" ]; then
            echo "files_changed=true" >> $GITHUB_OUTPUT
            echo "Changed files after lint fix:"
            echo "$CHANGED"
          else
            echo "files_changed=false" >> $GITHUB_OUTPUT
            echo "No files changed by lint fix."
          fi

      - name: Run Prettier auto-format
        id: prettier-fix
        run: |
          if grep -q 'prettier' package.json 2>/dev/null; then
            npx prettier --write 'src/**/*.{ts,tsx,js,jsx,css,json}' 2>&1 || true
            CHANGED=$(git diff --name-only)
            if [ -n "$CHANGED" ]; then
              echo "files_changed=true" >> $GITHUB_OUTPUT
            else
              echo "files_changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "files_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Commit and push fixes
        run: |
          CHANGED=$(git diff --name-only)
          if [ -z "$CHANGED" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git add -A
          git commit -m "style: auto-fix lint and formatting [skip ci]"
          # Pull rebase to avoid rejected push due to remote changes
          git pull --rebase origin ${{ github.head_ref || github.event.inputs.branch || github.ref_name }} || true
          git push origin HEAD:${{ github.head_ref || github.event.inputs.branch || github.ref_name }}

      - name: Post fix summary comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const lintFixed = '${{ steps.lint-fix.outputs.files_changed }}' === 'true';
            const prettierFixed = '${{ steps.prettier-fix.outputs.files_changed }}' === 'true';
            const anyFixed = lintFixed || prettierFixed;
            const body = anyFixed
              ? '## Auto-Fix Bot\n\nAutomatically fixed ESLint/Prettier issues and committed changes to this PR.\n\nRun `git pull` to get the latest fixes.'
              : '## Auto-Fix Bot\n\nNo auto-fixable issues found. The code looks clean!';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

      - name: Generate summary
        if: always()
        run: |
          echo "## Auto Fix Bot Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| ESLint Fix | ${{ steps.lint-fix.outputs.files_changed == 'true' && 'Fixed' || 'Clean' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Prettier Format | ${{ steps.prettier-fix.outputs.files_changed == 'true' && 'Formatted' || 'Clean' }} |" >> $GITHUB_STEP_SUMMARY
