name: Rollback

# Rollback Strategy:
# 1. Triggered automatically when CI fails on main after a merge
# 2. Can be triggered manually with /rollback comment on a PR
# 3. Can be triggered manually via workflow_dispatch with a target SHA
# Creates a revert commit and opens a PR to restore previous state

on:
  # Auto-trigger when workflow fails on main
  workflow_run:
    workflows:
      - CI Test Suite
      - Auto Build
    types: [completed]
    branches: [main]

  # Triggered by /rollback comment on issues/PRs
  issue_comment:
    types: [created]

  # Manual trigger with specific SHA to rollback to
  workflow_dispatch:
    inputs:
      rollback_to_sha:
        description: 'SHA to rollback main to (leave empty to rollback last merge)'
        required: false
      reason:
        description: 'Reason for rollback'
        required: false
        default: 'Manual rollback requested'

jobs:
  auto-rollback-on-failure:
    name: Auto Rollback on CI Failure
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Check if failure is from a recent merge
        id: check_merge
        run: |
          # Find the last merge commit on main
          LAST_MERGE=$(git log --merges --format="%H %s" -1)
          MERGE_SHA=$(echo "$LAST_MERGE" | awk '{print $1}')
          MERGE_TIME=$(git log -1 --format="%ct" $MERGE_SHA)
          NOW=$(date +%s)
          DIFF=$(( NOW - MERGE_TIME ))

          echo "Last merge: $LAST_MERGE"
          echo "Time since merge: ${DIFF}s"

          # Only auto-rollback if merge happened within last 2 hours
          if [ $DIFF -lt 7200 ]; then
            echo "should_rollback=true" >> $GITHUB_OUTPUT
            echo "merge_sha=$MERGE_SHA" >> $GITHUB_OUTPUT
          else
            echo "should_rollback=false" >> $GITHUB_OUTPUT
            echo "Merge too old for auto-rollback, manual rollback required"
          fi

      - name: Perform rollback
        if: steps.check_merge.outputs.should_rollback == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MERGE_SHA=${{ steps.check_merge.outputs.merge_sha }}
          ROLLBACK_BRANCH="rollback/auto-$(date +%s)"

          git config --local user.email "rollback-bot@github.com"
          git config --local user.name "Rollback Bot"

          # Create rollback branch from commit before the bad merge
          git checkout -b "$ROLLBACK_BRANCH"
          git revert -m 1 "$MERGE_SHA" --no-edit
          git push origin "$ROLLBACK_BRANCH"

          # Create emergency rollback PR
          gh pr create \
            --title "[ROLLBACK] Revert failing merge ${MERGE_SHA:0:7} on main" \
            --body "## Emergency Rollback

**Trigger:** CI failed on main after merge \`${MERGE_SHA:0:7}\`
**Failed workflow:** ${{ github.event.workflow_run.name }}
**Auto-generated at:** $(date -u)

### What happened
The CI pipeline failed on the \`main\` branch after a recent merge. This rollback PR reverts that merge to restore stability.

### Action Required
1. Review the failed CI run to identify the root cause
2. Fix the issue on the \`dev\` branch
3. Merge this rollback PR to restore \`main\`
4. Re-test on \`dev\` before re-promoting

> Auto-generated by Rollback Bot" \
            --base main \
            --head "$ROLLBACK_BRANCH" \
            --label "rollback,urgent"

  command-rollback:
    name: Handle /rollback Comment Command
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'issue_comment' &&
      startsWith(github.event.comment.body, '/rollback') &&
      github.event.issue.pull_request != null
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: React to comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Parse rollback command
        id: parse
        run: |
          COMMENT="${{ github.event.comment.body }}"
          # Extract SHA if provided: /rollback abc1234
          SHA=$(echo "$COMMENT" | awk '{print $2}')
          if [[ $SHA =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "rollback_sha=$SHA" >> $GITHUB_OUTPUT
          else
            # Default: rollback last merge
            LAST_MERGE_SHA=$(git log --merges --format="%H" -1)
            echo "rollback_sha=$LAST_MERGE_SHA" >> $GITHUB_OUTPUT
          fi

      - name: Perform manual rollback
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ROLLBACK_SHA=${{ steps.parse.outputs.rollback_sha }}
          ROLLBACK_BRANCH="rollback/manual-$(date +%s)"
          REQUESTER="${{ github.event.comment.user.login }}"

          git config --local user.email "rollback-bot@github.com"
          git config --local user.name "Rollback Bot"

          git checkout -b "$ROLLBACK_BRANCH"
          git revert -m 1 "$ROLLBACK_SHA" --no-edit 2>/dev/null || \
            git revert "$ROLLBACK_SHA" --no-edit
          git push origin "$ROLLBACK_BRANCH"

          gh pr create \
            --title "[ROLLBACK] Manual revert of ${ROLLBACK_SHA:0:7} by @${REQUESTER}" \
            --body "## Manual Rollback

**Requested by:** @${REQUESTER}
**Reverting SHA:** \`${ROLLBACK_SHA:0:7}\`
**Requested via:** #${{ github.event.issue.number }}

### Review and merge this PR to complete the rollback.

> Generated by Rollback Bot" \
            --base main \
            --head "$ROLLBACK_BRANCH" \
            --label "rollback"

  manual-rollback:
    name: Manual Rollback via Dispatch
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 20
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Determine rollback target
        id: target
        run: |
          INPUT_SHA="${{ github.event.inputs.rollback_to_sha }}"
          if [ -n "$INPUT_SHA" ]; then
            echo "target_sha=$INPUT_SHA" >> $GITHUB_OUTPUT
          else
            # Default: last merge commit
            LAST_MERGE=$(git log --merges --format="%H" -1)
            echo "target_sha=$LAST_MERGE" >> $GITHUB_OUTPUT
          fi

      - name: Create rollback branch and PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_SHA=${{ steps.target.outputs.target_sha }}
          REASON="${{ github.event.inputs.reason }}"
          ROLLBACK_BRANCH="rollback/dispatch-$(date +%s)"
          REQUESTER="${{ github.actor }}"

          git config --local user.email "rollback-bot@github.com"
          git config --local user.name "Rollback Bot"

          git checkout -b "$ROLLBACK_BRANCH"
          git revert -m 1 "$TARGET_SHA" --no-edit 2>/dev/null || \
            git revert "$TARGET_SHA" --no-edit
          git push origin "$ROLLBACK_BRANCH"

          gh pr create \
            --title "[ROLLBACK] Revert ${TARGET_SHA:0:7} - $REASON" \
            --body "## Rollback Request

**Triggered by:** @${REQUESTER}
**Reverting:** \`${TARGET_SHA:0:7}\`
**Reason:** ${REASON}

### Steps
1. This PR reverts the specified commit from main
2. Review the changes
3. Merge to complete rollback
4. Fix the root cause on dev before re-promoting

> Generated by Rollback Bot" \
            --base main \
            --head "$ROLLBACK_BRANCH" \
            --label "rollback"
