name: Stability Monitor & Auto-Rollback

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["CI Test Suite", "Auto Build"]
    types: [completed]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'check'
        type: choice
        options:
          - check
          - rollback
          - pin

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: stability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stability-check:
    name: Stability Check
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.check.outputs.status }}
      stable_sha: ${{ steps.check.outputs.stable_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Check recent workflow runs
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking recent CI runs..."
          RECENT=$(gh run list --workflow="CI Test Suite" --limit=5 --json conclusion,headSha 2>/dev/null || echo "[]")
          FAILURES=$(echo "$RECENT" | jq -r '[.[] | select(.conclusion=="failure")] | length' 2>/dev/null || echo "0")
          STABLE_SHA=$(echo "$RECENT" | jq -r '[.[] | select(.conclusion=="success")] | .[0].headSha // empty' 2>/dev/null || echo "")
          echo "Recent failures: $FAILURES"
          echo "Last stable SHA: $STABLE_SHA"
          if [ "$FAILURES" -ge 3 ]; then
            echo "status=unstable" >> $GITHUB_OUTPUT
          else
            echo "status=stable" >> $GITHUB_OUTPUT
          fi
          echo "stable_sha=${STABLE_SHA}" >> $GITHUB_OUTPUT

  auto-rollback:
    name: Auto Rollback
    needs: stability-check
    if: needs.stability-check.outputs.status == 'unstable' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create rollback issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STABLE_SHA: ${{ needs.stability-check.outputs.stable_sha }}
        run: |
          ISSUE_BODY="CI instability detected. Recommended stable commit: ${STABLE_SHA}. Please review recent commits and consider manual rollback."
          gh issue create --title "[Auto-Rollback] CI instability detected" --body "${ISSUE_BODY}" --label "bug" || echo "Issue creation skipped"

      - name: Rollback summary
        run: |
          echo "## Rollback Action Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.stability-check.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Stable SHA: ${{ needs.stability-check.outputs.stable_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Action: Rollback issue created, manual intervention recommended" >> $GITHUB_STEP_SUMMARY

  pin-stable-commit:
    name: Pin Stable Commit
    needs: stability-check
    if: needs.stability-check.outputs.status == 'stable' && github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'pin'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin stable commit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STABLE_SHA: ${{ needs.stability-check.outputs.stable_sha }}
        run: |
          gh release create "stable-$(date +%Y%m%d-%H%M%S)" --title "Stable Release $(date +%Y-%m-%d)" --notes "Auto-pinned stable commit: ${STABLE_SHA}" --target "${STABLE_SHA}" || echo "Release creation skipped"

  health-report:
    name: Health Report
    needs: stability-check
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate health report
        run: |
          echo "## Repository Health Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Stability Status | ${{ needs.stability-check.outputs.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Last Stable SHA | ${{ needs.stability-check.outputs.stable_sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Health check completed successfully." >> $GITHUB_STEP_SUMMARY
