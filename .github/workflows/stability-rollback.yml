name: Stability Monitor & Auto-Rollback

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["CI Test Suite", "Auto Build"]
    types: [completed]
  schedule:
    # Health check every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'check'
        type: choice
        options:
          - check
          - rollback
          - pin-stable

jobs:
  # ── Track Deployment Health ─────────────────────────────────────────────
  stability-check:
    name: Stability Check
    runs-on: ubuntu-latest
    outputs:
      is-stable: ${{ steps.check.outputs.is-stable }}
      last-stable-sha: ${{ steps.check.outputs.last-stable-sha }}
      failure-count: ${{ steps.check.outputs.failure-count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Check recent workflow runs
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Get recent workflow runs for CI Test Suite
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
              per_page: 10,
              status: 'completed'
            });

            let failureCount = 0;
            let lastStableSha = null;

            for (const run of runs.workflow_runs) {
              if (run.conclusion === 'failure') {
                failureCount++;
              } else if (run.conclusion === 'success' && !lastStableSha) {
                lastStableSha = run.head_sha;
              }
            }

            const isStable = failureCount < 3;
            core.setOutput('is-stable', isStable.toString());
            core.setOutput('last-stable-sha', lastStableSha || '');
            core.setOutput('failure-count', failureCount.toString());

            console.log(`Failure count: ${failureCount}`);
            console.log(`Is stable: ${isStable}`);
            console.log(`Last stable SHA: ${lastStableSha}`);

            if (!isStable) {
              core.warning(`${failureCount} consecutive failures detected!`);
            }

  # ── Auto-Rollback on Instability ────────────────────────────────────────
  auto-rollback:
    name: Auto Rollback
    runs-on: ubuntu-latest
    needs: stability-check
    if: needs.stability-check.outputs.is-stable == 'false' && needs.stability-check.outputs.last-stable-sha != ''
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create rollback branch
        run: |
          STABLE_SHA="${{ needs.stability-check.outputs.last-stable-sha }}"
          ROLLBACK_BRANCH="rollback/auto-$(date +%Y%m%d-%H%M%S)"
          echo "Rolling back to: $STABLE_SHA"
          git checkout -b "$ROLLBACK_BRANCH" "$STABLE_SHA"
          git push origin "$ROLLBACK_BRANCH"
          echo "ROLLBACK_BRANCH=$ROLLBACK_BRANCH" >> $GITHUB_ENV
          echo "STABLE_SHA=$STABLE_SHA" >> $GITHUB_ENV

      - name: Create rollback PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Auto-Rollback] Reverting to stable commit ${process.env.STABLE_SHA.substring(0,7)}`,
              body: `## Automatic Rollback

> This PR was automatically created due to ${{ needs.stability-check.outputs.failure-count }} consecutive CI failures.

**Stable SHA:** \`${process.env.STABLE_SHA}\`
**Failure Count:** ${{ needs.stability-check.outputs.failure-count }}
**Triggered by:** Stability Monitor

### What happened?
The main branch has experienced multiple CI failures in a row. This rollback PR reverts to the last known stable commit.

### Actions Required
- [ ] Review recent changes that caused failures
- [ ] Fix the root cause
- [ ] Close this PR if you want to keep current state
- [ ] Merge this PR to rollback to stable state

> Auto-generated by Stability Monitor workflow`,
              head: process.env.ROLLBACK_BRANCH,
              base: 'main',
              draft: false
            });

            // Add labels
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['rollback', 'automated', 'urgent']
            });

            // Create an issue to track the instability
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Stability Alert] Main branch unstable - Auto-rollback initiated`,
              body: `## Stability Alert

The main branch is unstable with **${{ needs.stability-check.outputs.failure-count }} consecutive failures**.

**Auto-Rollback PR:** #${pr.number}
**Target Stable SHA:** \`${process.env.STABLE_SHA}\`

### Immediate Actions
1. Check the [failing workflow runs](https://github.com/${{ github.repository }}/actions)
2. Review recent commits to main
3. Either fix the issue or merge the rollback PR

### Resolution
- Close this issue once the main branch is stable again`,
              labels: ['stability', 'automated', 'urgent']
            });

  # ── Pin Stable Release ─────────────────────────────────────────────────────
  pin-stable:
    name: Pin Stable Commit
    runs-on: ubuntu-latest
    needs: stability-check
    if: |
      needs.stability-check.outputs.is-stable == 'true' &&
      (github.event_name == 'push' || inputs.action == 'pin-stable')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag as stable
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create/update stable tag
          STABLE_TAG="stable-latest"
          git tag -fa "$STABLE_TAG" -m "Auto-tagged stable build: $(date -u)"
          git push origin "$STABLE_TAG" --force

          # Also create dated stable tag
          DATED_TAG="stable-$(date +%Y%m%d)"
          git tag -fa "$DATED_TAG" -m "Stable build $(date -u)" || true
          git push origin "$DATED_TAG" --force || true

          echo "Tagged ${{ github.sha }} as stable"

  # ── Health Report ──────────────────────────────────────────────────────────
  health-report:
    name: Health Report
    runs-on: ubuntu-latest
    needs: stability-check
    if: always()
    steps:
      - name: Report Status
        run: |
          echo "=== Branch Health Report ==="
          echo "Time: $(date -u)"
          echo "Branch: main"
          echo "Is Stable: ${{ needs.stability-check.outputs.is-stable }}"
          echo "Failure Count: ${{ needs.stability-check.outputs.failure-count }}"
          echo "Last Stable SHA: ${{ needs.stability-check.outputs.last-stable-sha }}"
          if [ "${{ needs.stability-check.outputs.is-stable }}" = "true" ]; then
            echo "Status: HEALTHY"
          else
            echo "Status: UNSTABLE - Rollback may be triggered"
          fi
