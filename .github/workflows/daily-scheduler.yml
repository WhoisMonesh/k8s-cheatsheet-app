name: Daily Scheduler

on:
  schedule:
    # Runs every day at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      run_all:
        description: 'Run all workflows'
        required: false
        default: 'true'

jobs:
  trigger-ci-test:
    name: Trigger CI Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ci-test workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci-test.yml',
              ref: 'main'
            });
            console.log('Triggered: ci-test.yml');

  trigger-auto-build:
    name: Trigger Auto Build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger auto-build workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'auto-build.yml',
              ref: 'main'
            });
            console.log('Triggered: auto-build.yml');

  trigger-security-scan:
    name: Trigger Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Trigger security-scan workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'security-scan.yml',
              ref: 'main'
            });
            console.log('Triggered: security-scan.yml');

  trigger-auto-fix:
    name: Trigger Auto Fix Bot
    runs-on: ubuntu-latest
    steps:
      - name: Trigger auto-fix-bot workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'auto-fix-bot.yml',
              ref: 'main'
            });
            console.log('Triggered: auto-fix-bot.yml');

  trigger-evolution:
    name: Trigger Evolution Bot
    runs-on: ubuntu-latest
    # Evolution bot runs weekly on Sunday only
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.schedule, '0 6 * * 0')
    steps:
      - name: Trigger evolution-bot workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'evolution-bot.yml',
              ref: 'main'
            });
            console.log('Triggered: evolution-bot.yml');

  trigger-performance:
    name: Trigger Performance Bot
    runs-on: ubuntu-latest
    steps:
      - name: Trigger performance-bot workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'performance-bot.yml',
              ref: 'main'
            });
            console.log('Triggered: performance-bot.yml');

  trigger-changelog:
    name: Trigger Changelog Bot
    runs-on: ubuntu-latest
    steps:
      - name: Trigger changelog-bot workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'changelog-bot.yml',
              ref: 'main'
            });
            console.log('Triggered: changelog-bot.yml');

  daily-summary:
    name: Daily Summary
    runs-on: ubuntu-latest
    needs: [trigger-ci-test, trigger-auto-build, trigger-security-scan, trigger-auto-fix, trigger-performance, trigger-changelog]
    if: always()
    steps:
      - name: Post daily summary
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const workflows = [
              'ci-test', 'auto-build', 'security-scan',
              'auto-fix-bot', 'performance-bot', 'changelog-bot'
            ];
            const body = [
              `## Daily Automation Run - ${date}`,
              '',
              '### Workflows Triggered',
              ...workflows.map(w => `- \u2705 ${w}`),
              '',
              '| Schedule | Time |',
              '|----------|------|',
              '| Daily (all bots) | 06:00 UTC |',
              '| Evolution bot | Sundays 02:00 UTC |',
              '| Dependabot | Mondays 09:00 UTC |',
              '',
              '_Auto-triggered by Daily Scheduler_'
            ].join('\n');

            // Create a discussion or issue for the daily run log
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[Daily Run] Automation Report - ${date}`,
                body: body,
                labels: ['automation', 'daily-report']
              });
            } catch(e) {
              console.log('Could not create issue (label may not exist):', e.message);
              console.log('Daily run completed for:', date);
            }
