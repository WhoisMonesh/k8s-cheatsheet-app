name: Auto Build Bot

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: false
        default: 'all'
        type: choice
        options: [all, linux, windows, mac]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: auto-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-build-check:
    name: Pre-build Validation
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if build-affecting files changed
        id: check
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo 'unknown')
          echo "Changed files: $CHANGED"
          if echo "$CHANGED" | grep -qE '(src/|electron/|public/|package\.json|vite\.config|tsconfig|index\.html)'; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [ "$CHANGED" = "unknown" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "No build-affecting files changed, skipping build."
          fi

  build-linux:
    name: Build Linux (AppImage)
    runs-on: ubuntu-latest
    needs: pre-build-check
    if: |
      needs.pre-build-check.outputs.should_build == 'true' &&
      (github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all' || github.event.inputs.platform == '')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite
        run: npm run build

      - name: Build Electron (Linux)
        run: npx electron-builder --linux AppImage --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: k8s-cheatsheet-linux-${{ github.sha }}
          path: dist_electron/*.AppImage
          retention-days: 14

  build-windows:
    name: Build Windows (NSIS)
    runs-on: windows-latest
    needs: pre-build-check
    if: |
      needs.pre-build-check.outputs.should_build == 'true' &&
      (github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'all' || github.event.inputs.platform == '')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite
        run: npm run build

      - name: Build Electron (Windows)
        run: npx electron-builder --win nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: k8s-cheatsheet-windows-${{ github.sha }}
          path: dist_electron/*.exe
          retention-days: 14

  build-mac:
    name: Build macOS (DMG)
    runs-on: macos-latest
    needs: pre-build-check
    if: |
      needs.pre-build-check.outputs.should_build == 'true' &&
      (github.event.inputs.platform == 'mac' || github.event.inputs.platform == 'all' || github.event.inputs.platform == '')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite
        run: npm run build

      - name: Build Electron (macOS)
        run: npx electron-builder --mac dmg --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: k8s-cheatsheet-mac-${{ github.sha }}
          path: dist_electron/*.dmg
          retention-days: 14

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-mac]
    if: always()
    steps:
      - name: Post build summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const linux = '${{ needs.build-linux.result }}';
            const windows = '${{ needs.build-windows.result }}';
            const mac = '${{ needs.build-mac.result }}';
            const icon = r => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';
            const sha = context.sha.substring(0, 7);
            const branch = context.ref.replace('refs/heads/', '');
            const allOk = [linux, windows, mac].filter(r => r !== 'skipped').every(r => r === 'success');

            const summary = [
              `## 📦 Auto Build Bot - Build Summary`,
              ``,
              `**Branch:** \`${branch}\` | **Commit:** \`${sha}\``,
              ``,
              `| Platform | Result |`,
              `|----------|--------|`,
              `| Linux (AppImage) | ${icon(linux)} ${linux} |`,
              `| Windows (NSIS) | ${icon(windows)} ${windows} |`,
              `| macOS (DMG) | ${icon(mac)} ${mac} |`,
              ``,
              allOk
                ? `✅ All builds succeeded! Artifacts are available for 14 days.`
                : `❌ Some builds failed. Check the Actions tab for details.`
            ].join('\n');

            await core.summary.addRaw(summary).write();
            console.log(summary);
