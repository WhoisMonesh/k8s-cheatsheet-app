name: Performance Bot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  performance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build 2>/dev/null || npx vite build 2>/dev/null || echo "Build step skipped"

      - name: Analyze bundle size
        id: bundle
        run: |
          if [ -d dist ]; then
            TOTAL=$(du -sb dist | cut -f1)
            TOTAL_KB=$((TOTAL / 1024))
            JS_SIZE=$(find dist -name '*.js' -exec du -sb {} + 2>/dev/null | awk '{sum+=$1} END {print sum+0}')
            JS_KB=$((JS_SIZE / 1024))
            CSS_SIZE=$(find dist -name '*.css' -exec du -sb {} + 2>/dev/null | awk '{sum+=$1} END {print sum+0}')
            CSS_KB=$((CSS_SIZE / 1024))
            echo "total_kb=$TOTAL_KB" >> $GITHUB_OUTPUT
            echo "js_kb=$JS_KB" >> $GITHUB_OUTPUT
            echo "css_kb=$CSS_KB" >> $GITHUB_OUTPUT
            echo "Bundle size: ${TOTAL_KB}KB (JS: ${JS_KB}KB, CSS: ${CSS_KB}KB)"
          else
            echo "total_kb=0" >> $GITHUB_OUTPUT
            echo "js_kb=0" >> $GITHUB_OUTPUT
            echo "css_kb=0" >> $GITHUB_OUTPUT
            echo "No dist folder found"
          fi

      - name: Check for performance anti-patterns
        id: antipatterns
        run: |
          ISSUES=""

          # Check for console.log in source
          CONSOLE_COUNT=$(grep -r "console\.log" src/ --include='*.tsx' --include='*.ts' --include='*.jsx' --include='*.js' 2>/dev/null | wc -l || echo 0)
          if [ "$CONSOLE_COUNT" -gt "0" ]; then
            ISSUES="${ISSUES}\n- Found $CONSOLE_COUNT console.log statements (remove for production)"
          fi

          # Check for any files
          ANY_COUNT=$(grep -r ": any" src/ --include='*.tsx' --include='*.ts' 2>/dev/null | wc -l || echo 0)
          if [ "$ANY_COUNT" -gt "5" ]; then
            ISSUES="${ISSUES}\n- Found $ANY_COUNT TypeScript 'any' types (consider proper typing)"
          fi

          # Check for large files
          LARGE_FILES=$(find src/ -name '*.tsx' -o -name '*.ts' 2>/dev/null | xargs wc -l 2>/dev/null | sort -rn | head -5 | awk '$1 > 300 {print $2 " (" $1 " lines)"}')
          if [ -n "$LARGE_FILES" ]; then
            ISSUES="${ISSUES}\n- Large files detected (consider splitting):\n$(echo $LARGE_FILES | tr ' ' '\n' | head -3)"
          fi

          echo "ISSUES<<EOF" >> $GITHUB_OUTPUT
          echo -e "$ISSUES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check dependencies count
        id: deps
        run: |
          DEP_COUNT=$(node -e "const p=require('./package.json'); console.log(Object.keys(p.dependencies||{}).length)" 2>/dev/null || echo 0)
          DEV_DEP_COUNT=$(node -e "const p=require('./package.json'); console.log(Object.keys(p.devDependencies||{}).length)" 2>/dev/null || echo 0)
          echo "dep_count=$DEP_COUNT" >> $GITHUB_OUTPUT
          echo "dev_dep_count=$DEV_DEP_COUNT" >> $GITHUB_OUTPUT

      - name: Comment performance report on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const totalKb = '${{ steps.bundle.outputs.total_kb }}';
            const jsKb = '${{ steps.bundle.outputs.js_kb }}';
            const cssKb = '${{ steps.bundle.outputs.css_kb }}';
            const issues = `${{ steps.antipatterns.outputs.ISSUES }}`;
            const depCount = '${{ steps.deps.outputs.dep_count }}';
            const devDepCount = '${{ steps.deps.outputs.dev_dep_count }}';

            const sizeStatus = parseInt(totalKb) > 500 ? '⚠️ Large bundle' : '✅ Bundle size OK';

            const body = [
              '## Performance Report',
              '',
              '### Bundle Analysis',
              `| Metric | Value | Status |`,
              `|--------|-------|--------|`,
              `| Total Size | ${totalKb}KB | ${sizeStatus} |`,
              `| JavaScript | ${jsKb}KB | ${parseInt(jsKb) > 400 ? '⚠️' : '✅'} |`,
              `| CSS | ${cssKb}KB | ${parseInt(cssKb) > 100 ? '⚠️' : '✅'} |`,
              `| Dependencies | ${depCount} prod, ${devDepCount} dev | ${parseInt(depCount) > 20 ? '⚠️ Many deps' : '✅'} |`,
              '',
              issues ? `### Issues Found\n${issues}` : '### No Performance Issues Found ✅',
              '',
              '_Generated by Performance Bot_'
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
