name: Issue To Code Bot

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

jobs:
  issue-to-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    # Only run when issue has 'implement' or 'auto-implement' label,
    # or comment contains /implement command
    if: |
      (github.event_name == 'issues' && (
        contains(github.event.issue.labels.*.name, 'implement') ||
        contains(github.event.issue.labels.*.name, 'auto-implement')
      )) ||
      (github.event_name == 'issue_comment' &&
        startsWith(github.event.comment.body, '/implement'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get issue details
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });
            core.setOutput('title', issue.data.title);
            core.setOutput('body', issue.data.body || '');
            core.setOutput('number', issueNumber);
            return issue.data;

      - name: Generate implementation with AI
        id: implement
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
        run: |
          SRC_STRUCTURE=$(find src/ -name '*.tsx' -o -name '*.ts' 2>/dev/null | head -20 | tr '\n' ',' || echo "src/")

          cat > implement.js << 'JSEOF'
          const https = require('https');
          const fs = require('fs');
          const title = process.env.ISSUE_TITLE || 'No title';
          const body = process.env.ISSUE_BODY || '';
          const structure = process.env.SRC_STRUCTURE || '';

          const prompt = 'You are a senior React/TypeScript developer. Based on this GitHub issue for a Kubernetes Cheatsheet app, generate implementation code. Issue: ' + title + '\n' + body + '\nExisting files: ' + structure + '\n\nGenerate a complete implementation. Respond with JSON: {"files": [{"path": "src/components/NewComponent.tsx", "content": "// full file content", "description": "what this does"}], "summary": "Brief description", "pr_body": "Detailed PR description"}';

          const data = JSON.stringify({
            model: 'gpt-4o',
            messages: [{ role: 'user', content: prompt }],
            max_tokens: 3000,
            response_format: { type: 'json_object' }
          });

          const options = {
            hostname: 'api.openai.com',
            path: '/v1/chat/completions',
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + process.env.OPENAI_API_KEY,
              'Content-Length': Buffer.byteLength(data)
            }
          };

          const req = https.request(options, (res) => {
            let responseBody = '';
            res.on('data', chunk => responseBody += chunk);
            res.on('end', () => {
              try {
                const result = JSON.parse(responseBody);
                const content = result.choices[0].message.content;
                const parsed = JSON.parse(content);
                fs.writeFileSync('implementation.json', JSON.stringify(parsed));
                console.log('Implementation generated:', parsed.summary);
              } catch(e) {
                console.error('Error:', e.message);
                fs.writeFileSync('implementation.json', JSON.stringify({ files: [], summary: 'Failed', pr_body: '' }));
              }
            });
          });
          req.on('error', e => {
            fs.writeFileSync('implementation.json', JSON.stringify({ files: [], summary: 'API error', pr_body: '' }));
          });
          req.write(data);
          req.end();
          JSEOF

          ISSUE_TITLE="$ISSUE_TITLE" ISSUE_BODY="$ISSUE_BODY" SRC_STRUCTURE="$SRC_STRUCTURE" node implement.js

      - name: Apply implementation files
        id: apply
        run: |
          if [ ! -f implementation.json ]; then
            echo "No implementation file found"
            exit 0
          fi
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('implementation.json', 'utf8'));
            const files = data.files || [];
            let created = [];
            files.forEach(f => {
              if (f.path && f.content && f.path.startsWith('src/')) {
                const dir = require('path').dirname(f.path);
                fs.mkdirSync(dir, { recursive: true });
                fs.writeFileSync(f.path, f.content);
                created.push(f.path);
                console.log('Created:', f.path);
              }
            });
            fs.writeFileSync('created-files.txt', created.join('\\n'));
          "

      - name: Create pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUM=${{ steps.issue.outputs.number }}
          BRANCH_NAME="implement/issue-${ISSUE_NUM}-$(date +%s)"
          git config --local user.email "issue-to-code-bot@github.com"
          git config --local user.name "Issue To Code Bot"
          git checkout -b "$BRANCH_NAME"
          git add src/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No files to commit"
            exit 0
          fi
          SUMMARY=$(node -e "const d=require('./implementation.json'); console.log(d.summary||'Implementation')" 2>/dev/null || echo "Implementation")
          PR_BODY=$(node -e "const d=require('./implementation.json'); console.log(d.pr_body||'Auto-generated implementation')" 2>/dev/null || echo "Auto-generated")
          git commit -m "feat: implement issue #${ISSUE_NUM} - ${SUMMARY}"
          git push origin "$BRANCH_NAME"
          TITLE="feat: implement issue #${ISSUE_NUM} - ${SUMMARY}"
          BODY="Closes #${ISSUE_NUM}. ${PR_BODY}. Auto-generated by Issue To Code Bot"
          gh pr create --title "$TITLE" --body "$BODY" --base main --head "$BRANCH_NAME" --label "auto-implemented"
