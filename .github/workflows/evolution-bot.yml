name: Evolution Bot

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  evolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests and collect metrics
        run: |
          npm test -- --coverage --json --outputFile=test-results.json 2>/dev/null || true
          echo "Tests completed"

      - name: Analyze codebase with AI
        id: analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Write as .cjs to avoid ESM 'require is not defined' error
          cat > analyze.cjs << 'EOF'
          const https = require('https');
          const fs = require('fs');
          const path = require('path');

          const srcFiles = [];
          function walkDir(dir) {
            try {
              const files = fs.readdirSync(dir);
              files.forEach(file => {
                const fullPath = path.join(dir, file);
                const stat = fs.statSync(fullPath);
                if (stat.isDirectory() && !file.startsWith('.') && file !== 'node_modules') {
                  walkDir(fullPath);
                } else if (file.match(/\.(tsx?|jsx?|css)$/) && srcFiles.length < 10) {
                  srcFiles.push({ path: fullPath, content: fs.readFileSync(fullPath, 'utf8').slice(0, 500) });
                }
              });
            } catch(e) {}
          }
          walkDir('src');

          const summary = srcFiles.map(f => `File: ${f.path}\n${f.content}`).join('\n---\n').slice(0, 3000);
          const prompt = `You are a senior software architect. Analyze this React/TypeScript codebase and suggest 3 specific improvements as GitHub issues. For each, provide title, body, and labels.\n\nCode:\n${summary}\n\nRespond with JSON: {"suggestions": [{"title": "", "body": "", "labels": ["enhancement"]}]}`;

          const apiKey = process.env.OPENAI_API_KEY;
          if (!apiKey) {
            console.log('No OPENAI_API_KEY set, writing empty suggestions');
            fs.writeFileSync('evolution-suggestions.json', JSON.stringify({suggestions: []}));
            process.exit(0);
          }

          const data = JSON.stringify({
            model: 'gpt-4o-mini',
            messages: [{ role: 'user', content: prompt }],
            max_tokens: 1500
          });

          const options = {
            hostname: 'api.openai.com',
            path: '/v1/chat/completions',
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiKey}`,
              'Content-Length': Buffer.byteLength(data)
            }
          };

          const req = https.request(options, (res) => {
            let body = '';
            res.on('data', chunk => body += chunk);
            res.on('end', () => {
              try {
                const result = JSON.parse(body);
                const content = result.choices[0].message.content;
                let parsed;
                try { parsed = JSON.parse(content); } catch(e) { parsed = {suggestions:[]}; }
                fs.writeFileSync('evolution-suggestions.json', JSON.stringify(parsed));
                console.log('Analysis complete');
              } catch(e) {
                console.log('Parse error:', e.message);
                fs.writeFileSync('evolution-suggestions.json', JSON.stringify({suggestions:[]}));
              }
            });
          });
          req.on('error', (e) => {
            console.log('Request error:', e.message);
            fs.writeFileSync('evolution-suggestions.json', JSON.stringify({suggestions:[]}));
          });
          req.write(data);
          req.end();
          EOF
          node analyze.cjs

      - name: Create evolution issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f evolution-suggestions.json ]; then
            # Write script as .cjs to avoid ESM issues
            cat > create-issues.cjs << 'EOF'
            const fs = require('fs');
            const https = require('https');
            const raw = fs.readFileSync('evolution-suggestions.json', 'utf8');
            let data;
            try { data = JSON.parse(raw); } catch(e) { process.exit(0); }
            const suggestions = data.suggestions || (Array.isArray(data) ? data : []);
            suggestions.slice(0,3).forEach(s => {
              const body = JSON.stringify({
                title: s.title || 'Evolution suggestion',
                body: s.body || 'AI-generated improvement',
                labels: s.labels || ['enhancement', 'evolution']
              });
              const repo = process.env.GITHUB_REPOSITORY;
              const opts = {
                hostname: 'api.github.com',
                path: `/repos/${repo}/issues`,
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `token ${process.env.GITHUB_TOKEN}`,
                  'User-Agent': 'evolution-bot',
                  'Content-Length': Buffer.byteLength(body)
                }
              };
              const req = https.request(opts, r => {
                let b = '';
                r.on('data', c => b += c);
                r.on('end', () => {
                  try { console.log('Created issue:', JSON.parse(b).number); } catch(e) {}
                });
              });
              req.on('error', e => console.error('Error:', e.message));
              req.write(body);
              req.end();
            });
            EOF
            GITHUB_REPOSITORY="${{ github.repository }}" node create-issues.cjs
          fi

      - name: Check for outdated dependencies
        run: |
          npm outdated --json > outdated.json 2>/dev/null || true
          OUTDATED=$(node --input-type=commonjs -e "
            const fs = require('fs');
            try {
              const d = JSON.parse(fs.readFileSync('outdated.json', 'utf8'));
              console.log(Object.keys(d).length);
            } catch(e) { console.log(0); }
          " 2>/dev/null || echo '0')
          echo "Outdated packages: $OUTDATED"
          if [ "$OUTDATED" -gt "5" ]; then
            echo "::warning::$OUTDATED outdated packages found. Consider running dependency update."
          fi

      - name: Evolution summary
        if: always()
        run: |
          echo "## Evolution Bot Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f evolution-suggestions.json ]; then
            COUNT=$(node --input-type=commonjs -e "
              const fs = require('fs');
              try {
                const d = JSON.parse(fs.readFileSync('evolution-suggestions.json'));
                const s = d.suggestions || [];
                console.log(s.length);
              } catch(e) { console.log(0); }
            " 2>/dev/null || echo 0)
            echo "- AI Suggestions generated: $COUNT" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- Run completed: $(date -u)" >> $GITHUB_STEP_SUMMARY
