name: Security Scan Bot

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 6 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  codeql-analysis:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for CodeQL
        run: npm run build
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'

  npm-audit:
    name: npm Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        id: audit
        run: |
          npm audit --json > audit-report.json 2>&1 || true
          npm audit --audit-level=moderate 2>&1 | tee audit-output.txt || true
          VULN_COUNT=$(node -e "
            try {
              const r = JSON.parse(require('fs').readFileSync('audit-report.json'));
              const v = r.metadata && r.metadata.vulnerabilities;
              if (v) console.log((v.critical||0) + ':' + (v.high||0) + ':' + (v.moderate||0) + ':' + (v.low||0));
              else console.log('0:0:0:0');
            } catch(e) { console.log('0:0:0:0'); }
          " 2>/dev/null || echo '0:0:0:0')
          echo "vuln_summary=$VULN_COUNT" >> $GITHUB_OUTPUT
          echo "Vulnerabilities: $VULN_COUNT"
        continue-on-error: true

      - name: Post audit results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let auditOutput = '';
            try { auditOutput = fs.readFileSync('audit-output.txt', 'utf8').slice(0, 4000); } catch(e) {}
            let report = {};
            try { report = JSON.parse(fs.readFileSync('audit-report.json', 'utf8')); } catch(e) {}

            const v = report.metadata && report.metadata.vulnerabilities || {};
            const critical = v.critical || 0;
            const high = v.high || 0;
            const moderate = v.moderate || 0;
            const low = v.low || 0;
            const total = critical + high + moderate + low;

            const icon = total === 0 ? '✅' : critical > 0 || high > 0 ? '🚨' : '⚠️';
            const body = `## ${icon} Security Scan Bot - npm Audit\n\n` +
              `| Severity | Count |\n|----------|-------|\n` +
              `| 🔴 Critical | ${critical} |\n` +
              `| 🟠 High | ${high} |\n` +
              `| 🟡 Moderate | ${moderate} |\n` +
              `| 🔵 Low | ${low} |\n` +
              `| **Total** | **${total}** |\n\n` +
              (total === 0
                ? `✅ **No vulnerabilities found!** This PR is clean.`
                : `<details><summary>Audit Details</summary>\n\n\`\`\`\n${auditOutput}\n\`\`\`\n</details>\n\n` +
                  (critical > 0 || high > 0
                    ? `🚨 **Critical/High vulnerabilities found. Run \`npm audit fix\` to resolve.**`
                    : `⚠️ Moderate/Low vulnerabilities found. Consider running \`npm audit fix\`.`));

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

      - name: Open security issue if critical vulns found (scheduled)
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let report = {};
            try { report = JSON.parse(fs.readFileSync('audit-report.json', 'utf8')); } catch(e) { return; }
            const v = report.metadata && report.metadata.vulnerabilities || {};
            const critical = v.critical || 0;
            const high = v.high || 0;
            if (critical === 0 && high === 0) {
              console.log('No critical/high vulnerabilities. Skipping issue creation.');
              return;
            }
            // Check for existing open security issues
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security'
            });
            const existing = issues.data.find(i => i.title.includes('[Security Bot]'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `🤖 **Security Bot update** (${new Date().toDateString()}): Found ${critical} critical, ${high} high vulnerabilities. Run \`npm audit fix\` to resolve.`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '[Security Bot] Vulnerabilities detected in dependencies',
                body: `## 🚨 Security Bot Alert\n\nAutomated security scan found vulnerabilities:\n\n| Severity | Count |\n|----------|-------|\n| Critical | ${critical} |\n| High | ${high} |\n\n**Action required:** Run \`npm audit fix\` to resolve.\n\n_Auto-detected on ${new Date().toDateString()}_`,
                labels: ['security', 'bug']
              });
            }

  dependency-review:
    name: Dependency Review (PRs only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
          comment-summary-in-pr: always
